name: Publish Android 2.0.4
on:
  push:
    branches: [ccr-9280ef63-c3br7q]
    paths: [tmp-apk/work-hours-2.0.4.apk]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify, create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s  %s\n' '46d2db90fdae4c9a5f883c247a3fe2e750b490397953f8acbd4fadd4d71f9505' 'tmp-apk/work-hours-2.0.4.apk' | sha256sum --check --strict
          cat > notes.md <<'NOTES'
          Work Hours 2.0.4

          - Godziny urlopu wliczają się do sumy tygodnia i normy (kwota urlopu osobno).
          - Standardowe godziny dnia urlopu w ustawieniach urlopu.
          - Urlop na pulpicie można zmienić lub usunąć.
          - Pola z godzinami: 17.45 / 1745 → 17:45.
          - Bez przykładowych nazw w podpowiedziach.

          Zainstaluj na starszą wersję bez odinstalowywania — dane zostają. Podpis jak w poprzednich wersjach.
          SHA-256: 46d2db90fdae4c9a5f883c247a3fe2e750b490397953f8acbd4fadd4d71f9505
          NOTES
          gh release create v2.0.4 --target main --latest --title "Work Hours 2.0.4" --notes-file notes.md tmp-apk/work-hours-2.0.4.apk
