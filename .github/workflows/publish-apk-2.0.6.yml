name: Publish Android 2.0.6
on:
  push:
    branches: [ccr-9280ef63-c3br7q]
    paths: [tmp-apk/work-hours-2.0.6.apk]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify, create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s  %s\n' '77000a4b7b2422531729b37f219370e31e29c8410ef08eaaf1125632231d3971' 'tmp-apk/work-hours-2.0.6.apk' | sha256sum --check --strict
          cat > notes.md <<'NOTES'
          Work Hours 2.0.6

          - Uporządkowany pulpit: podsumowanie zmiany, duży licznik, jeden przycisk Rozpocznij/Zakończ zmianę i siatka kafelków z pozostałymi akcjami.

          Zainstaluj na starszą wersję bez odinstalowywania — dane zostają. Podpis jak w poprzednich wersjach.
          SHA-256: 77000a4b7b2422531729b37f219370e31e29c8410ef08eaaf1125632231d3971
          NOTES
          gh release create v2.0.6 --target main --latest --title "Work Hours 2.0.6" --notes-file notes.md tmp-apk/work-hours-2.0.6.apk
