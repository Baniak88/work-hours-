name: Publish Android 2.0.3
on:
  push:
    branches: [ccr-9280ef63-c3br7q]
    paths: [tmp-apk/work-hours-2.0.3.apk]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify, create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s  %s\n' '425291f508e7dcbcfa095bba9f34502e768f0e55a6cdaf41297733447c473f54' 'tmp-apk/work-hours-2.0.3.apk' | sha256sum --check --strict
          cat > notes.md <<'NOTES'
          Work Hours 2.0.3

          - Język aplikacji dopasowuje się do języka telefonu (Ustawienia → Język → Automatyczny).
          - Nazwa zmiany na pulpicie jest tłumaczona w wersji angielskiej.
          - Logo w aplikacji jest takie samo jak ikona.

          Zainstaluj na starszą wersję bez odinstalowywania — dane zostają. Podpis jak w poprzednich wersjach.
          SHA-256: 425291f508e7dcbcfa095bba9f34502e768f0e55a6cdaf41297733447c473f54
          NOTES
          gh release create v2.0.3 --target main --latest --title "Work Hours 2.0.3" --notes-file notes.md tmp-apk/work-hours-2.0.3.apk
