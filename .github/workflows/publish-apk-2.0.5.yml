name: Publish Android 2.0.5
on:
  push:
    branches: [ccr-9280ef63-c3br7q]
    paths: [tmp-apk/work-hours-2.0.5.apk]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify, create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s  %s\n' '6d8e619ef7c754f6a0aa2359e7432dd548ac99d8033b31f59e3c5978ee1736aa' 'tmp-apk/work-hours-2.0.5.apk' | sha256sum --check --strict
          cat > notes.md <<'NOTES'
          Work Hours 2.0.5

          - Nowy wygląd: ciemny nagłówek, jasny arkusz treści, pływający pasek nawigacji; nowy motyw Szmaragdowy.
          - Urlop w kalendarzu: dotknij dnia z urlopem, aby go edytować lub usunąć.
          - Dodawanie urlopu: wpis ręczny albo wybór dni z kalendarza.

          Zainstaluj na starszą wersję bez odinstalowywania — dane zostają. Podpis jak w poprzednich wersjach.
          SHA-256: 6d8e619ef7c754f6a0aa2359e7432dd548ac99d8033b31f59e3c5978ee1736aa
          NOTES
          gh release create v2.0.5 --target main --latest --title "Work Hours 2.0.5" --notes-file notes.md tmp-apk/work-hours-2.0.5.apk
