name: Publish Android 2.0.0
on:
  push:
    branches: [ccr-9280ef63-c3br7q]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify, create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s  %s\n' 'dc8ab82ffa1d9963ef8550c6cf47c7b396c35d1c1d2af2b860a41e439d1c51c4' 'tmp-apk/work-hours-2.0.0.apk' | sha256sum --check --strict
          cat > notes.md <<'NOTES'
          Work Hours 2.0.0 — nowy wygląd w stylu iPhone'a.

          - Motywy w kolorach systemowych iOS, karty z gładkimi rogami i cieniem.
          - Przyciski w kształcie pigułki, wypełnione Start/Stop.
          - Pływający pasek nawigacji, duże tytuły, formularze w panelu z uchwytem.

          Zainstaluj na starszą wersję bez odinstalowywania — dane zostają. Podpis jak w poprzednich wersjach.
          SHA-256: dc8ab82ffa1d9963ef8550c6cf47c7b396c35d1c1d2af2b860a41e439d1c51c4
          NOTES
          gh release create v2.0.0 --target main --title "Work Hours 2.0.0" --notes-file notes.md tmp-apk/work-hours-2.0.0.apk
