name: Upload verified Android APK
on:
  push:
    branches: [codex/upload-apk-1.9.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed APK
        run: |
          curl --fail --location --retry 2 'https://expo.dev/artifacts/eas/nrFPz9XN2eLqbfg6s_1tcUheEvjHNejuJ4GNbau5vPQ.apk' --output work-hours-1.9.0.apk
          printf '%s  %s\n' 'b61dea7ce8a6d56e03f091687e656b27edf48dba087ca98b4a1e849ef8d44814' 'work-hours-1.9.0.apk' | sha256sum --check --strict
      - name: Attach APK to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v1.9.0 work-hours-1.9.0.apk
