name: Upload verified Android APK
on:
  push:
    branches: [codex/upload-apk-1.9.4]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed APK
        run: |
          curl --fail --location --retry 2 'https://expo.dev/artifacts/eas/15puO0TWkE5Li8CKOdwZBC51XXmz2162L7aPQq7mSH8.apk' --output work-hours-1.9.4.apk
          printf '%s  %s\n' 'a9b79d687e47dfe11f78135a65021a15e63a75be222f545648ddc8242837d9da' 'work-hours-1.9.4.apk' | sha256sum --check --strict
      - name: Attach APK to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v1.9.4 work-hours-1.9.4.apk
