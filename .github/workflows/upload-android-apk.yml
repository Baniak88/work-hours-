name: Upload verified Android APK
on:
  push:
    branches: [codex/upload-apk-1.9.5]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed APK
        run: |
          curl --fail --location --retry 2 'https://expo.dev/artifacts/eas/3mJDd4vz2LMKdZ1kbvkCKtszIqd17WQsxAfceEsWLgg.apk' --output work-hours-1.9.5.apk
          printf '%s  %s\n' '4f4a337fdd2f23b82efafc15e18be9b4e54b7a41ab42654f7681f93d264e3c46' 'work-hours-1.9.5.apk' | sha256sum --check --strict
      - name: Attach APK to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v1.9.5 work-hours-1.9.5.apk
