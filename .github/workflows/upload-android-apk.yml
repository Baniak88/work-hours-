name: Upload verified Android APK
on:
  push:
    branches: [codex/upload-apk-1.3.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed APK
        run: |
          curl --fail --location --retry 2 'https://expo.dev/artifacts/eas/fFuuBdLoY8-TCyydApJLxv0CwhZoXqywsmptFtQh5oc.apk' --output work-hours-1.3.0.apk
          printf '%s  %s\n' '0e7cc385d54b41dc73cfb50a02065aae2d658e2893b4c9b70264dc630714cef5' 'work-hours-1.3.0.apk' | sha256sum --check --strict
      - name: Attach APK to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v1.3.0 work-hours-1.3.0.apk
