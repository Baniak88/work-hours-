name: Upload verified Android APK
on:
  push:
    branches: [codex/upload-apk-1.2.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed APK
        run: |
          curl --fail --location --retry 2 'https://expo.dev/artifacts/eas/96Yibih1Lq2ku9JPRdtnBGmep0DauPtWuzIqQsz5x8E.apk' --output work-hours-1.2.0.apk
          printf '%s  %s\n' '08fdf1b4ffd35f40103113e9f11406e9c2b9dc7967cc6663161c2d04352ea0d3' 'work-hours-1.2.0.apk' | sha256sum --check --strict
      - name: Attach APK to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v1.2.0 work-hours-1.2.0.apk
