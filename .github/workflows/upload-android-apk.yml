name: Upload verified Android APK
on:
  push:
    branches: [codex/upload-apk-1.5.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed APK
        run: |
          curl --fail --location --retry 2 'https://expo.dev/artifacts/eas/ANkJ7_KZTFmkoE9umHE8syx6qyxtosTznRjmYqOdVFM.apk' --output work-hours-1.5.0.apk
          printf '%s  %s\n' '901686d224365d141c0eedd58ae6ae2480e1306e87aa4dc8c1dd23582bc8ed71' 'work-hours-1.5.0.apk' | sha256sum --check --strict
      - name: Attach APK to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v1.5.0 work-hours-1.5.0.apk
