name: Upload verified Android APK
on:
  push:
    branches: [codex/upload-apk-1.7.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed APK
        run: |
          curl --fail --location --retry 2 'https://expo.dev/artifacts/eas/nVxTU2uJ5hDevy7V7gxp4-2wjrKGnias0XHLmbTS8eM.apk' --output work-hours-1.7.0.apk
          printf '%s  %s\n' 'c351876b80b0a23a15e7a5d4c4b57b279f57e2028aa39d27f6ff24c393944435' 'work-hours-1.7.0.apk' | sha256sum --check --strict
      - name: Attach APK to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v1.7.0 work-hours-1.7.0.apk
