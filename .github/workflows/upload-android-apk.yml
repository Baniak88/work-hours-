name: Upload verified Android APK
on:
  push:
    branches: [codex/upload-apk-1.4.0]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify signed APK
        run: |
          curl --fail --location --retry 2 'https://expo.dev/artifacts/eas/WVDW6i4q7KhCxvMdH1FHy9QIwluOOvSFk3jxwGzitIg.apk' --output work-hours-1.4.0.apk
          printf '%s  %s\n' '7e1cf62046566a595816fb9762a68580bfaf6ac28e0744ec7ffdac1511cee1ef' 'work-hours-1.4.0.apk' | sha256sum --check --strict
      - name: Attach APK to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v1.4.0 work-hours-1.4.0.apk
